<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>em tee vee</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div id="app">
    <div id="player-container">
      <video id="player" autoplay></video>
      <div id="overlay">
        <div id="now-playing">
          <span id="song-title"></span>
          <span id="song-artist"></span>
        </div>
        <div id="controls">
          <button id="btn-prev" title="Previous">&#9664;&#9664;</button>
          <button id="btn-play" title="Play/Pause">&#9654;</button>
          <button id="btn-next" title="Next">&#9654;&#9654;</button>
          <button id="btn-shuffle" title="Reshuffle">&#8645;</button>
        </div>
      </div>
    </div>

    <div id="sidebar">
      <div id="sidebar-header">
        <h1>em tee vee</h1>
        <button id="btn-sync" title="Sync from Spotify">Sync</button>
      </div>
      <div id="sync-status" class="hidden">
        <div id="sync-progress-bar"><div id="sync-progress-fill"></div></div>
        <span id="sync-text"></span>
      </div>
      <ul id="playlist"></ul>
    </div>
  </div>

  <script src="/static/player.js"></script>
</body>
</html>
