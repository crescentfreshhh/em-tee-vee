services:
  mtv:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - ./videos:/app/videos
      - mtv-cache:/root/.cache
    environment:
      - SPOTIPY_CLIENT_ID=${SPOTIPY_CLIENT_ID}
      - SPOTIPY_CLIENT_SECRET=${SPOTIPY_CLIENT_SECRET}
      - SPOTIPY_REDIRECT_URI=${SPOTIPY_REDIRECT_URI:-http://localhost:5000/auth/callback}
      - MTV_SECRET_KEY=${MTV_SECRET_KEY:-change-me-to-something-random}
      - MTV_DOWNLOAD_DIR=/app/videos
    restart: unless-stopped
